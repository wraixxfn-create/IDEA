<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171c1e" />
    <meta name="description" content="A vast, empty seven-sector hexagonal world foundation." />
    <title>HEXFIELD — World Foundation</title>
  </head>
  <body>
    <main id="app" aria-label="Hexfield exploration world">
      <div id="viewport" class="viewport">
        <div class="hud hud-top">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true"><span></span></div>
            <div class="brand-copy">
              <p class="eyebrow">WORLD FOUNDATION / 01</p>
              <h1>HEXFIELD</h1>
            </div>
          </div>

          <div class="world-readout" aria-label="World structure">
            <div class="readout-item"><span class="readout-value">07</span><span class="readout-label">sectors</span></div>
            <span class="readout-divider" aria-hidden="true"></span>
            <div class="readout-item"><span class="readout-value">12</span><span class="readout-label">open gates</span></div>
          </div>
        </div>

        <div class="control-strip" aria-label="Controls">
          <div class="control-row"><span class="key-cluster"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>move</span></div>
          <div class="control-row"><kbd class="wide-key">SHIFT</kbd><span>sprint</span></div>
          <div class="control-row"><span class="mouse-glyph" aria-hidden="true">↕</span><span>look around</span></div>
          <div class="control-row debug-control"><kbd class="wide-key">F3</kbd><span>debug overview</span></div>
        </div>

        <div class="center-reticle" aria-hidden="true"><span></span></div>

        <div id="experience-prompt" class="experience-prompt" role="status" aria-live="polite">
          <button id="enter-world" class="enter-button" type="button">
            <span class="enter-icon" aria-hidden="true">↗</span>
            <span id="enter-label">Click to explore</span>
            <span class="enter-arrow" aria-hidden="true">→</span>
          </button>
          <p id="prompt-note">Mouse look captures the pointer · Press Esc to release</p>
        </div>

        <div id="debug-state" class="debug-state" aria-live="polite">
          <span class="debug-dot" aria-hidden="true"></span>
          DEBUG OVERVIEW
          <span class="debug-state-divider">/</span>
          F3 TO RETURN
        </div>

        <div class="hud hud-bottom">
          <div class="footer-label"><span class="footer-rule"></span>EMPTY WORLD / OPEN GEOMETRY</div>
          <div class="footer-label footer-right">WALK · LOOK · EXPLORE <span class="footer-coordinate">—</span></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
